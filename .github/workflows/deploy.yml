name: Backend Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npm run prisma:generate
        working-directory: backend

      - name: Build for production
        run: npm run build
        working-directory: backend

      - name: Create deployment artifact
        run: |
          cd backend
          tar -czf ../backend-prod-${{ github.sha }}.tar.gz dist/ node_modules/ package.json package-lock.json prisma/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-prod-build
          path: backend-prod-${{ github.sha }}.tar.gz
          retention-days: 30

      # Uncomment and configure these sections based on your deployment platform
      # 
      # - name: Deploy to Heroku
